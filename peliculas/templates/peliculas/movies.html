<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peliculas</title>
</head>
<body>
    <h1>Personajes y Peliculas</h1>

    {% for character in characters %}

    <h2>{{ character.name }}</h2>

    <ul>
        {% for movie in character.movies.all %}
            <li>{{ movie.name }}</li>
        {% endfor %} 
    </ul>

    {% endfor %}
</body>
</html>
